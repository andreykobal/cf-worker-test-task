name: Deploy Migration Worker

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      
      - run: npm ci

      # Upload all migrations to KV
      - name: Upload migrations to KV
        run: |
          for f in $(find prisma/migrations -name "migration.sql"); do
            key="$(basename $(dirname "$f")).sql"
            echo "→ Uploading $key"
            npx wrangler kv key put --namespace-id=44c991d461d04acca04fc3852879d76e "$key" --path="$f"
          done
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}

      # Deploy the Worker
      - name: Deploy Worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}

      # Automatically trigger migrations
      - name: Trigger migrations
        run: |
          echo "🚀 Triggering migrations at https://migration-worker.kobalandreas.workers.dev"
          curl -sf https://migration-worker.kobalandreas.workers.dev || echo "⚠️ Migration trigger failed, will retry on next deploy"

